<html lang="en">

      <tr>

                <p style="margin:0 0 24px;padding:18px 20px;border-radius:14px;background:#161512;color:#fff7e6;font-size:30px;font-weight:600;letter-spacing:6px;text-align:center;">{{ .Token }}</p>
                <p style="margin:0;font-size:12px;line-height:19px;color:#8a847d;">The code expires in one hour. If you did not request it, you can ignore this email.</p>
