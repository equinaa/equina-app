<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Confirm your new email</title>
  </head>
  <body style="margin:0;background:#f4f1e9;font-family:Arial,Helvetica,sans-serif;color:#161512;">
    <!-- Email change. The app has no email change yet; this keeps the email on-brand if Auth ever sends it. With double confirmation on, both addresses get it. -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:18px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 28px;font-size:12px;font-weight:700;letter-spacing:2px;color:#9a783e;">EQUINA</p>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:32px;font-weight:600;">Confirm your new email</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:23px;color:#6b6560;">Confirm that your Equina account should use {{ .NewEmail }} instead of {{ .Email }}.</p>
                <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:14px;background:#161512;color:#fff7e6;font-size:15px;font-weight:600;text-decoration:none;">Confirm the change</a></p>
                <p style="margin:0;font-size:12px;line-height:19px;color:#8a847d;">If you did not ask for this change, ignore this email and your account keeps its current email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:11px;line-height:17px;color:#8a847d;">Sent by Equina to {{ .Email }}.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
