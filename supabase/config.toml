project_id = "equina"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://equina-ten.vercel.app"
additional_redirect_urls = [
  "equina://auth/callback",
  "equina://auth/email",
  "equina://auth/recovery",
  "http://localhost:8081",
  "http://localhost:8081/auth/email",
  "http://localhost:8081/auth/recovery",
  "https://equina-ten.vercel.app",
  "https://equina-ten.vercel.app/auth/email",
  "https://equina-ten.vercel.app/auth/recovery"
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# On, as in the hosted project (checked 2026-11-09: mailer_autoconfirm false).
# A password sign-up waits for a six-digit code sent to the email, which is also
# what keeps automatic identity linking safe once Apple or Google sign-in is
# enabled: every email on an account is verified.
#
# The codes only reach riders through custom SMTP (Resend, from auth.equina.ai):
# Supabase's built-in mailer delivers to members of the Supabase organization
# only, and does not let the hosted templates change. The hosted project is
# configured in the Dashboard -- see docs/EQUINA_AUTH_DELIVERY.md -- so keep the
# two in step by hand.
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

# Once these are the hosted templates, every email carries the six-digit code
# (the email-change template still carries a link; no app flow uses it). The app
# asks for the code when EXPO_PUBLIC_EQUINA_EMAIL_AUTH_MODE=otp; switch it only
# once these are the hosted templates.
[auth.email.template.confirmation]
subject = "Confirm your Equina email: {{ .Token }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Equina sign-in code: {{ .Token }}"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Your Equina password reset code: {{ .Token }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "Your Equina verification code: {{ .Token }}"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.email_change]
subject = "Confirm your new Equina email"
content_path = "./supabase/templates/email_change.html"

# Hosted values, set in Dashboard -> Authentication -> Emails -> SMTP Settings.
# Kept as a comment: the API key never goes in this file, and this project does
# not push its config to the hosted project.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "no-reply@auth.equina.ai"
# sender_name = "Equina"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.backend-capabilities]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Mux signs its webhooks (Mux-Signature); the function checks that instead.
[functions.mux-webhook]
verify_jwt = false

# RevenueCat sends the Authorization value set on its webhook; the function
# compares it with REVENUECAT_WEBHOOK_AUTHORIZATION instead of a JWT.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.process-order-deadlines]
verify_jwt = false

[functions.process-content-moderation]
verify_jwt = false

[functions.process-storage-cleanup]
verify_jwt = false

[functions.process-account-deletions]
verify_jwt = false

[functions.process-notification-outbox]
verify_jwt = false

[functions.process-data-export-cleanup]
verify_jwt = false
