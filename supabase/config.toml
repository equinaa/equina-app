project_id = "equina"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://equina-ten.vercel.app"
additional_redirect_urls = [
  "equina://auth/callback",
  "equina://auth/email",
  "equina://auth/recovery",
  "http://localhost:8081",
  "http://localhost:8081/auth/email",
  "http://localhost:8081/auth/recovery",
  "https://equina-ten.vercel.app",
  "https://equina-ten.vercel.app/auth/email",
  "https://equina-ten.vercel.app/auth/recovery"
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off for the TestFlight cohort (2026-10-03): signing up with a password signs
# the rider in at once. With confirmations on, the built-in mailer only reaches
# members of the Supabase organization, so no tester could finish signing up,
# and a link opened on another device left the app waiting.
#
# Turn it back on -- as a 6-digit code typed in the app, once custom SMTP
# (Resend) sends the templates -- before the App Store launch, and before
# Apple or Google sign-in is enabled: automatic identity linking is only safe
# against pre-account takeover when every email on an account is verified.
# The hosted project is configured in the Dashboard; keep the two in step.
enable_confirmations = false
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

# Supabase's default free-tier mailer does not permit hosted template changes.
# Connect custom SMTP before enabling supabase/templates/magic_link.html here.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.backend-capabilities]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Mux signs its webhooks (Mux-Signature); the function checks that instead.
[functions.mux-webhook]
verify_jwt = false

[functions.process-order-deadlines]
verify_jwt = false

[functions.process-content-moderation]
verify_jwt = false

[functions.process-storage-cleanup]
verify_jwt = false

[functions.process-account-deletions]
verify_jwt = false

[functions.process-notification-outbox]
verify_jwt = false

[functions.process-data-export-cleanup]
verify_jwt = false
